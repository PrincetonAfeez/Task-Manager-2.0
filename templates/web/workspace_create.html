{% extends "base.html" %}
{% block title %}New workspace · Task Manager{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Create a workspace</h1>
  <p class="muted">A workspace holds its own tasks, members, automation and billing.</p>
  <form method="post" class="stacked-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create workspace</button>
  </form>
</section>
{% endblock %}
