  scope_honesty:
    overclaims: []
    undocumented_behavior:
      - "The audit log deliberately survives a workspace purge in detached form. This is now documented (docs/DATA_POLICY.md section 5 and the privacy policy) with the reasoning, but it is behaviour a customer requesting erasure would not otherwise expect."
      - "An API-key write is attributed to the person who created the key, not to an anonymous service principal. Documented in api/mixins.py::acting_user; a reader of the activity feed sees a human name for an automated action."

  security_posture:
    exposed_surfaces:
      - "Login, signup and password reset - public; per-IP throttling plus per-account lockout, no account enumeration on reset."
      - "REST API at /api/v1/ - session or API key; tenant-scoped querysets, role matrix, per-key throttles."
      - "Public share links at /shared/<token>/ - the only route serving customer data without a session; hashed token, one list, read-only, no member identities, noindex, no-store, revocable."
      - "Health endpoints - public but carry no customer data."
      - "Django admin - staff session, configurable path, audit log read-only; its login is routed through the product sign-in so two-step verification applies."
      - "Two-step challenge at /accounts/mfa/ - reachable only with a password-verified pending login (5-minute lifetime); throttled and locked after five wrong codes."
      - "SSO at /sso/ and /sso/callback/ - unauthenticated by design; state, nonce and PKCE bound to the browser session, ID token fully verified, provider URLs SSRF-validated."
      - "Stripe webhook at /billing/webhooks/stripe/ - unauthenticated and CSRF-exempt by design; HMAC signature with timestamp tolerance, idempotent, state re-read from Stripe's API; returns 404 when not configured."
      - "Outbound webhooks - we are the client; SSRF-validated, no redirects followed, hard timeouts, capped response reads."
    strongest_control: "Tenant isolation is structural rather than per-endpoint discipline: a base class scopes get_queryset so list and detail share one rule, serializers reject foreign relations, and a codebase-wide test fails the build if a view reaches an unscoped manager."
    weakest_control: "External validation. Two-step verification, SSO, payments and malware scanning now exist, but SSO and Stripe are proven only against fakes, and no third party has tested any of it. The controls most likely to hide a defect are the ones that have never met the real service they integrate with."

  summary:
    critical: 0
    high: 0
    medium: 0
    low: 2
    pass_gate: production_ready
    verdict: "Production-ready at the inferred ENTERPRISE contract: all Universal Core, LAUNCH, GROWTH and applicable ENTERPRISE checks pass. Two Lows remain, both about external validation rather than missing controls: no third-party penetration test, and SSO verified against a test provider rather than a commercial one. Stripe has likewise not been run against a real account. Each is stated plainly in the README and the security review."
