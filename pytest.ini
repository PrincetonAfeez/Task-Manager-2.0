[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    slow: tests that exercise loops or large fixtures
    integration: tests that cross app boundaries end to end
filterwarnings =
    error::DeprecationWarning:kernel.*
    error::DeprecationWarning:tasks.*
    error::DeprecationWarning:queues.*
    error::DeprecationWarning:schedules.*
    error::DeprecationWarning:api.*
    error::DeprecationWarning:web.*
    ignore::DeprecationWarning
